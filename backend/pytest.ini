[pytest]
; `backend/` is the effective import root (every module imports bare, e.g.
; `from services.connectors import ...`), so tests are run from here - `cd backend && pytest`.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    spark: needs a real local SparkSession (slower to start) - skip with `pytest -m "not spark"`
