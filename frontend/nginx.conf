server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing - fall back to index.html for
    # any path that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uncomment if the backend isn't given its own public URL, so relative
    # "/api" calls (the default in src/constants/appConfig.js) reach it via
    # this container instead:
    # location /api/ {
    #     proxy_pass http://backend:5050/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
